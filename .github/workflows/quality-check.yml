name: Quality Check

on:
  pull_request:
    paths:
      - 'docs/**'
      - '_data/**'
      - 'scripts/check_kakomon_dual_sync.py'
      - 'scripts/check_kakomon_pages_sync.py'
      - 'scripts/gen_kakomon_by_year.py'
      - 'scripts/check_stale_evidence.py'
      - 'scripts/check_mojibake.py'
      - 'scripts/tests/check_stale_evidence/**'
      - 'wiki_check.py'
      - '.github/workflows/quality-check.yml'
  push:
    branches: [master]
    paths:
      - 'docs/**'
      - '_data/**'
      - 'scripts/check_kakomon_dual_sync.py'
      - 'scripts/check_kakomon_pages_sync.py'
      - 'scripts/gen_kakomon_by_year.py'
      - 'scripts/check_stale_evidence.py'
      - 'scripts/check_mojibake.py'
      - 'scripts/tests/check_stale_evidence/**'
      - 'wiki_check.py'
      - '.github/workflows/quality-check.yml'

jobs:
  wiki-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install deps
        run: python -m pip install --quiet pyyaml
      # 文字化けゲートを最初に実行: U+FFFD で壊れた行は他ゲートの正規表現に
      # マッチせず「監査の盲点」になる（by-field.md 問番号セル破損・PR #74）。
      # 根本原因を先に赤くする。
      - name: mojibake gate (U+FFFD 置換文字・不正バイト列の混入検出)
        run: python scripts/check_mojibake.py
      - name: Run wiki_check.py
        run: python wiki_check.py docs/
      - name: kakomon dual-file sync guard (_data/ == docs/_data/)
        run: python scripts/check_kakomon_dual_sync.py
      - name: kakomon by-year + year-page sync guard (yml ↔ 派生md)
        run: python scripts/check_kakomon_pages_sync.py
      # 照合日パーサ回帰ガード: パーサが壊れると記事は WARN（STALE ではない）に落ち、
      # 月次 audit-stale-evidence は issue を立てず無音化する。PR 時点で破壊を検出する。
      - name: check_stale_evidence self-test (照合日パーサ回帰ガード)
        run: python scripts/tests/check_stale_evidence/test_check_stale_evidence.py
      - name: MathJax block math sanity (arithmatex blank-line check)
        run: |
          set -e
          LEAKS=$(find docs -name "*.md" -print0 | xargs -0 awk '
            depth==0 && /^[[:space:]]*\$\$[[:space:]]*$/ {
              if (prev != "" && prev !~ /^\s*$/ && prev !~ /^\s*\$\$/)
                print FILENAME":"NR": "prev;
              depth=1; next
            }
            /^[[:space:]]*\$\$[[:space:]]*$/ { depth=0 }
            { prev=$0 }
          ')
          if [ -n "$LEAKS" ]; then
            echo "::error::pymdownx.arithmatex requires a blank line before block \$\$. Found:"
            echo "$LEAKS"
            exit 1
          fi
          echo "OK: all \$\$ blocks have proper blank-line separation"
