name: Quality Check

on:
  pull_request:
    paths:
      - 'docs/**'
      - '_data/**'
      - 'scripts/check_kakomon_dual_sync.py'
      - 'scripts/check_kakomon_pages_sync.py'
      - 'scripts/gen_kakomon_by_year.py'
      - 'scripts/check_stale_evidence.py'
      - 'scripts/check_mojibake.py'
      - 'scripts/check_law_facts.py'
      - 'scripts/check_law_citations.py'
      - 'scripts/check_theme_article_numbers.py'
      - 'scripts/audit_kaishaku_titles.py'
      - 'scripts/audit_titles.py'
      - 'scripts/audit_jigyoho_titles.py'
      - 'scripts/article_title_match.py'
      - 'scripts/cache/**'
      - 'mkdocs.yml'
      - 'scripts/tests/check_stale_evidence/**'
      - 'wiki_check.py'
      - '.github/workflows/quality-check.yml'
  push:
    branches: [master]
    paths:
      - 'docs/**'
      - '_data/**'
      - 'scripts/check_kakomon_dual_sync.py'
      - 'scripts/check_kakomon_pages_sync.py'
      - 'scripts/gen_kakomon_by_year.py'
      - 'scripts/check_stale_evidence.py'
      - 'scripts/check_mojibake.py'
      - 'scripts/check_law_facts.py'
      - 'scripts/check_law_citations.py'
      - 'scripts/check_theme_article_numbers.py'
      - 'scripts/audit_kaishaku_titles.py'
      - 'scripts/audit_titles.py'
      - 'scripts/audit_jigyoho_titles.py'
      - 'scripts/article_title_match.py'
      - 'scripts/cache/**'
      - 'mkdocs.yml'
      - 'scripts/tests/check_stale_evidence/**'
      - 'wiki_check.py'
      - '.github/workflows/quality-check.yml'

jobs:
  wiki-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install deps
        run: python -m pip install --quiet pyyaml
      # 文字化けゲートを最初に実行: U+FFFD で壊れた行は他ゲートの正規表現に
      # マッチせず「監査の盲点」になる（by-field.md 問番号セル破損・PR #74）。
      # 根本原因を先に赤くする。
      - name: mojibake gate (U+FFFD 置換文字・不正バイト列の混入検出)
        run: python scripts/check_mojibake.py
      # 検出パターン自体の回帰ガード。旧 PLACEHOLDER_PATTERN は「[要確認: 理由]」形式を
      # 1件も拾えず、条文原文が未転記のページを CI 全緑のまま通していた（本 self-test の制定事案）。
      - name: wiki_check 検出パターン self-test
        run: python wiki_check.py --self-test
      - name: Run wiki_check.py
        run: python wiki_check.py docs/
      # 実装済みなのに verify_suite にも CI にも配線されていなかった2ゲート（孤児）。
      # 両方とも実測 0 件 clean のため、緑のうちに固定して以後の退行を検出する。
      - name: 法令事実ゲート（数値ハルシネーション3類型）
        run: python scripts/check_law_facts.py docs
      - name: 法令引用ゲート（_data/law_articles.yml 突合）
        run: python scripts/check_law_citations.py docs
      # themes/strategy 等（記事以外）が書く「省令第N条（見出し）」を articles/ の正本と突合。
      # 事故: hoan-gensoku.md が「保安原則=省令第1条〜第4条」と教えていた（正しくは第4条〜第18条・PR #154）。
      # 記事側は audit_titles.py が原典照合済みだが、記事**以外**のページは誰も検査していなかった。
      - name: theme/strategy 条番号↔見出し整合 self-test
        run: python scripts/check_theme_article_numbers.py --self-test
      - name: theme/strategy 条番号↔見出し整合ゲート
        run: python scripts/check_theme_article_numbers.py --strict
      # 電技解釈の 条番号↔条見出し を**原典由来マスタ**（_data/kaishaku_article_titles.json・
      # 経産省公表PDF 令和7年11月版から機械抽出）と逐語照合する。
      # 事故: 解釈は e-Gov 法令API に無く「外部正本と照合できない」前提で内部整合しか
      # 見ていなかったため、誤帰属が CI 全緑のまま残存した（PR #156 漏電遮断器=第37条→正は第36条／
      # PR #157 第71条に第65条の内容／PR #158 第133条の中身が第135条）。
      # 上の check_theme_article_numbers.py は articles/ の H1 を正本にするので、
      # 本ステップがその正本自体を原典と突合する（＝正本の正本）。
      - name: 解釈 条番号↔条見出し 外部照合 self-test
        run: python scripts/audit_kaishaku_titles.py --self-test
      - name: 解釈 条番号↔条見出し 外部照合ゲート（原典マスタ突合）
        run: python scripts/audit_kaishaku_titles.py --external --strict
      # 省令・事業法も同じ判定ロジック（scripts/article_title_match.py）で突合する。
      # 事故: 解釈側にだけ入れた「他条の見出しと逐語一致なら ERROR」規則が省令側に無く、
      # kijun/index.md に第7条・第39条・第47条の見出しがそのまま別の条に付いている誤りが
      # 3件残っていた（PR #161 で解釈側を直した時点では気づけなかった）。
      # 判定を1箇所に集約し、法令ごとに正本 dict だけ差し替える構成にした。
      - name: 省令 条番号↔条見出し ゲート（e-Gov 突合・記事H1 + index + nav）
        run: python scripts/audit_titles.py --strict
      - name: 事業法 条番号↔条見出し self-test
        run: python scripts/audit_jigyoho_titles.py --self-test
      - name: 事業法 条番号↔条見出し ゲート（e-Gov 本則突合）
        run: python scripts/audit_jigyoho_titles.py --strict
      - name: kakomon dual-file sync guard (_data/ == docs/_data/)
        run: python scripts/check_kakomon_dual_sync.py
      - name: kakomon by-year + year-page sync guard (yml ↔ 派生md)
        run: python scripts/check_kakomon_pages_sync.py
      # 照合日パーサ回帰ガード: パーサが壊れると記事は WARN（STALE ではない）に落ち、
      # 月次 audit-stale-evidence は issue を立てず無音化する。PR 時点で破壊を検出する。
      - name: check_stale_evidence self-test (照合日パーサ回帰ガード)
        run: python scripts/tests/check_stale_evidence/test_check_stale_evidence.py
      - name: MathJax block math sanity (arithmatex blank-line check)
        run: |
          set -e
          LEAKS=$(find docs -name "*.md" -print0 | xargs -0 awk '
            depth==0 && /^[[:space:]]*\$\$[[:space:]]*$/ {
              if (prev != "" && prev !~ /^\s*$/ && prev !~ /^\s*\$\$/)
                print FILENAME":"NR": "prev;
              depth=1; next
            }
            /^[[:space:]]*\$\$[[:space:]]*$/ { depth=0 }
            { prev=$0 }
          ')
          if [ -n "$LEAKS" ]; then
            echo "::error::pymdownx.arithmatex requires a blank line before block \$\$. Found:"
            echo "$LEAKS"
            exit 1
          fi
          echo "OK: all \$\$ blocks have proper blank-line separation"
