name: Audit kakomon.yml

on:
  schedule:
    # 月初 9:00 JST = 0:00 UTC
    - cron: '0 0 1 * *'
  workflow_dispatch:
    # 手動実行も可

permissions:
  contents: read
  issues: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deps
        run: pip install pyyaml

      - name: Run external audit
        id: audit
        run: |
          mkdir -p inbox
          set -o pipefail
          # exit 2 = 不一致あり（正常系・後段で起票）。それ以外の非0 = ツール自壊 → job を赤に
          python scripts/audit_kakomon.py --all --delay 1.5 \
            --json inbox/audit-mismatches.json 2>&1 | tee inbox/audit-log.txt || [ $? -eq 2 ]
          echo "mismatch_count=$(python -c "import json; print(len(json.load(open('inbox/audit-mismatches.json'))))")" >> $GITHUB_OUTPUT

      # denken-ou.com 停止・URL体系変更・HTML構造変更ではパーサは例外を吐かず全件 skipped に
      # 落ち、mismatch 0 件＝緑のまま監査が無音で盲目化する（既存 issue も自動クローズされる）。
      # 「照合に成功した件数」がキャッシュ検証済み件数の半分を割ったら fail させて可視化する
      - name: Coverage floor guard (照合崩壊の無音死ガード)
        run: |
          python <<'PY'
          import re, sys, yaml
          log = open('inbox/audit-log.txt', encoding='utf-8').read()
          m = re.search(r'^一致: (\d+) \| 不一致: (\d+)', log, re.M)
          compared = int(m.group(1)) + int(m.group(2)) if m else 0
          cache = yaml.safe_load(open('_data/denken-ou-cache.yml', encoding='utf-8')) or {}
          verified = len(cache.get('verified') or {})
          floor = max(10, (verified + 1) // 2)
          print(f"照合成功 {compared} 件 / floor {floor} 件 (cache verified {verified} 件)")
          if compared < floor:
              print(f"::error::照合成功 {compared} 件 < floor {floor} 件。denken-ou.com 停止/"
                    f"URL体系変更/HTML構造変更で監査が盲目化している可能性（mismatch 0 は"
                    f"「全件一致」ではなく「何も照合できていない」かもしれない）。"
                    f"一時的なサイト障害なら workflow_dispatch で再実行", file=sys.stderr)
              sys.exit(1)
          PY

      - name: Filter cache-known mismatches (real bugs only)
        id: filter
        run: |
          python <<'PY' >> $GITHUB_OUTPUT
          import json, yaml, os
          mis = json.load(open('inbox/audit-mismatches.json'))
          try:
              cache = yaml.safe_load(open('_data/denken-ou-cache.yml',encoding='utf-8')) or {}
              verified = (cache.get('verified') or {})
          except FileNotFoundError:
              verified = {}
          # キャッシュに登録済みエントリで不一致が出たもの = 法令改正/誤編集の確証
          real = [m for m in mis if f"{m['year']}-{m['num']}" in verified]
          # キャッシュ未登録は HTML 簡易パース誤検出の可能性大 → 別レポート
          unverified = [m for m in mis if f"{m['year']}-{m['num']}" not in verified]
          json.dump(real, open('inbox/audit-real-issues.json','w'), ensure_ascii=False, indent=2)
          json.dump(unverified, open('inbox/audit-unverified.json','w'), ensure_ascii=False, indent=2)
          print(f"real_count={len(real)}")
          print(f"unverified_count={len(unverified)}")
          PY

      - name: Ensure audit label exists
        if: steps.filter.outputs.real_count != '0'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh label create audit --color B60205 --description "kakomon.yml 監査検出" 2>/dev/null || true

      - name: Create issue on real mismatch
        if: steps.filter.outputs.real_count != '0'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BODY=$(python <<'PY'
          import json
          mis = json.load(open('inbox/audit-real-issues.json'))
          lines = ["## kakomon.yml 監査で検証済みエントリに不一致を検出", ""]
          lines.append("外部一次ソース（denken-ou.com）と `_data/denken-ou-cache.yml` の検証済みエントリで不整合が発生。")
          lines.append("**法令改正または誤編集の可能性**。手動レビューが必要。")
          lines.append("")
          lines.append("### 不一致一覧")
          lines.append("")
          for m in mis:
              lines.append(f"- **{m['year']}問{m['num']}**: {m['topic']}")
              lines.append(f"    - 記録: `{m['recorded']}`")
              lines.append(f"    - denken-ou: 第{m['denken_ou_article_num']}条")
              lines.append(f"    - URL: {m['url']}")
          lines.append("")
          lines.append("### 対処")
          lines.append("1. URL を開いて手動確認")
          lines.append("2. 真に誤登録なら kakomon.yml を修正")
          lines.append("3. 法令改正なら関連条文ページも更新したうえで `python scripts/audit_kakomon.py --all --cache _data/denken-ou-cache.yml` でキャッシュ再生成")
          print("\n".join(lines))
          PY
          )
          gh issue create \
            --title "[audit] kakomon.yml 監査不一致 ${{ steps.filter.outputs.real_count }}件" \
            --body "$BODY" \
            --label audit

      - name: Auto-close stale audit issues (mismatch解消確認)
        if: steps.filter.outputs.real_count == '0'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue list --label audit --state open --json number --jq '.[].number' | while read n; do
            [ -z "$n" ] && continue
            gh issue close "$n" --comment "監査再実行で不一致解消を確認（$(date -u +%Y-%m-%d) auto-audit）"
          done

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: audit-results
          path: |
            inbox/audit-*.json
            inbox/audit-log.txt
          retention-days: 90
