#   live #1（--rank --v3 の現首位） vs 本ファイルの gold.path
# を比較し、首位ページが入れ替わっていたら Issue を立てる。
#
# 【更新手順】首位が入れ替わった（= Issue が立った）とき:
#   1. 新首位ページの内容を確認し、ゴールド昇格を承認するか判断する
#   2. 承認するなら gold.path / gold.score / gold.verdict / updated を更新
#   3. CLAUDE.md・denken-page-creation.md のパス記述も追従（任意・補助情報）
#   4. 旧 Issue は次回監査（首位が記録と一致）で自動クローズされる
