# 一次照合済みの「同じ事実」を repo 全体で1箇所に固定するレジストリ。
#
# 制定事案: 2026-08-28 の全数監査。既存ゲートが 7/7 PASS のまま、
# 「条文に存在しない数値を試験の核心として教えている」「同じ事実の値がページ間で
# 食い違う」層が大量に残っていた（B種接地の係数・罰則額・安全率・径間・判定軸 等）。
# 条見出し照合（audit_*_titles）でも逐語照合（check_law_verbatim）でも捕まらない。
# 前者は見出しだけ、後者は「条文原文」ブロックだけを見るため、
# **解説・要約・暗記表に書かれた数値**は誰も検査していなかった。
#
# 使い方は scripts/check_verified_facts.py を参照。
# ルールを足すときは必ず「監査前コミットに当てて実際に fire するか」を確認する
# （fire しないルールは、その事故を検出できないただの飾り）。

facts:
  # ---------------------------------------------------------------- 接地
  - id: b-shu-coefficient
    label: B種接地抵抗の遮断時間別係数（解釈17-1表）
    source: 電技解釈 第17条第2項第一号 17-1表（同梱PDF p.32）
    verified: "2026-08-28"
    forbid:
      - pattern: '(?<![0-9])50\s*/\s*Ig'
        why: 17-1表に「50/Ig」という区分は存在しない。正は 150/Ig（下記以外）・300/Ig（1秒超2秒以下）・600/Ig（1秒以下）
      - pattern: '0\.5秒[^。\n]{0,20}(?:B種|150|300|600)\s*/?\s*Ig|B種[^。\n]{0,20}0\.5秒'
        why: 17-1表の時間区分は「1秒を超え2秒以下」「1秒以下」。「0.5秒」の区分は存在しない
    unless:
      # 「0.5秒の区分は無い」と**誤りとして説明している**行（ひっかけ集・訂正注記）
      - '(?:区分|規定)は(?:無|な)い|存在しない|(?:は|＝|=)?誤り|ではな(?:い|く)|と思い込む|正しいか|旧版|訂正'

  # ---------------------------------------------------------------- 罰則
  - id: penalty-118
    label: 電気事業法第118条の法定刑（罰金額）
    source: 電気事業法 第118条（e-Gov 339AC0000000170）
    verified: "2026-08-28"
    consistent:
      pattern: '第118条[^。\n／/）)（(|、]{0,40}?(?P<value>[0-9０-９,]+万円)'
      expect: "300万円"
  - id: penalty-120
    label: 電気事業法第120条の法定刑（罰金額）
    source: 電気事業法 第120条（e-Gov 339AC0000000170）
    verified: "2026-08-28"
    consistent:
      pattern: '第120条[^。\n／/）)（(|、]{0,40}?(?P<value>[0-9０-９,]+万円)'
      expect: "30万円"
  - id: nonexistent-article-131
    label: 電気事業法に第131条は存在しない
    source: 電気事業法（e-Gov 339AC0000000170）の条文は第120条台まで
    verified: "2026-08-28"
    forbid:
      - pattern: '電気事業法[^。\n]{0,20}第131条|第131条[^。\n]{0,20}(?:罰則|罰金)'
        why: 電気事業法に第131条は無い。第40条命令違反の罰則は第118条第6号
    unless:
      - '存在しない|は無い|は誤り|ではな(?:い|く)|旧版|訂正'

  # ---------------------------------------------------------------- 主任技術者
  - id: article-43-paragraphs
    label: 電気事業法第43条は全5項（第6項は無い）
    source: 電気事業法 第43条（e-Gov 339AC0000000170）
    verified: "2026-08-28"
    forbid:
      - pattern: '第43条第6項|第43条[^。\n]{0,30}全6項'
        why: 第43条は第1項〜第5項。「大臣が主任技術者の解任を命じる」規定も存在しない
    unless:
      - '存在しない|は無い|は誤り|ではな(?:い|く)|旧版|訂正'

  # ---------------------------------------------------------------- 工事計画
  - id: article-47-no-days
    label: 電気事業法第47条に日数規定は無い
    source: 電気事業法 第47条（e-Gov 339AC0000000170）
    verified: "2026-08-28"
    forbid:
      - pattern: '第47条[^。\n]{0,40}(?:90日|九十日)|(?:90日|九十日)[^。\n]{0,30}第47条'
        why: 「着工90日前まで」は俗称で条文に無い。30日の待機は第48条（届出受理日から30日経過後）
    unless:
      # 「90日前は俗称であって法定ではない」と説明している行
      - '俗称|法定の数値ではない|日数規定がなく|規定は(?:無|な)い|存在しない|は誤り|ではな(?:い|く)|旧版|訂正'

  # ---------------------------------------------------------------- 支持物
  - id: wooden-pole-safety-factor
    label: 木柱の安全率（解釈第59条）
    source: 電技解釈 第59条（同梱PDF）
    verified: "2026-08-28"
    forbid:
      - pattern: '(?:支持物|鉄柱|鉄塔|鉄筋コンクリート柱)[^。\n]{0,25}安全率[^。\n]{0,15}1\.5'
        why: 架空電線路の支持物に「安全率1.5」という規定は無い。数値付きは木柱2.0（第59条）／基礎2・鉄塔異常時1.33（第60条）／支線2.5・特例1.5（第61条）
    unless:
      # 1.5 が正しい別条（無線用アンテナ等支持物の基礎＝第141条第四号）と、
      # 支線の特例（第61条）。誤りとして説明している行も抑制する。
      - '第141条|無線[用通]|第61条|支線|存在しない|一度も出てこない|は無い|(?:は|＝|=)?誤り|ではな(?:い|く)|と思い込む|正しいか|旧版|訂正'

  # ---------------------------------------------------------------- 径間
  - id: span-63
    label: 解釈第63条の径間上限（63-1表）
    source: 電技解釈 第63条 63-1表（同梱PDF）
    verified: "2026-08-28"
    forbid:
      - pattern: '第63条[^。\n]{0,60}(?:60m|120m)'
        why: 63-1表は 木柱・A種150m／B種250m／鉄塔600m（170kV以上800m）。60m/120m は別条の値
    unless:
      - '存在しない|は無い|は誤り|ではな(?:い|く)|旧版|訂正'

  # ---------------------------------------------------------------- 耐圧試験
  - id: lv-withstand-10min
    label: 低圧電路の絶縁耐力試験は連続10分間（解釈第16条第6項第一号イ・16-4表）
    source: 電技解釈 第16条第6項第一号イ・16-4表（同梱PDF）「16-4表に規定する試験電圧を…連続して10分間加えたとき」
    verified: "2026-08-28"
    forbid:
      - pattern: '低圧[^。\n]{0,40}(?:試験|耐圧|絶縁耐力)[^。\n]{0,30}1分間'
        why: 16-4表の試験電圧は「最大使用電圧の1.5倍（500V未満なら500V）」で、印加は連続10分間。「500V固定・1分間」は本条の規定ではない
      - pattern: '(?:対地間試験電圧|試験電圧)[^。\n]{0,20}500V[^。\n]{0,20}固定|500V固定'
        why: 16-4表は「最大使用電圧の1.5倍（500V未満となる場合は、500V）」。500V は下限であって固定値ではない
    unless:
      - '存在しない|は無い|(?:は|＝|=)?誤り|ではな(?:い|く)|と思い込む|正しいか|旧版|訂正|防護具'

  # ---------------------------------------------------------------- 罰則（行為→金額）
  - id: penalty-shunin-unassigned
    label: 主任技術者の未選任の罰金額
    source: 電気事業法 第118条第7号（第43条第1項違反）— e-Gov 339AC0000000170
    verified: "2026-08-28"
    consistent:
      pattern: '主任技術者の?未選任[^。\n]{0,30}?(?P<value>[0-9０-９,]+万円)'
      expect: "300万円"
  - id: penalty-inspection-refusal
    label: 立入検査の拒否・妨害の罰金額
    source: 電気事業法 第117条の2第12号（第107条第1項の検査拒否）— e-Gov 339AC0000000170
    verified: "2026-08-28"
    require:
      # 電気事業法の立入検査（第107条）の行にだけ適用する。
      # 電気用品安全法・電気工事業法にも同名の「立入検査の拒否」があり、
      # そちらの法定刑は本 repo で一次照合できていない（誤爆すると honest-hold を壊す）。
      - '第107条'
    consistent:
      pattern: '立入検査[^。\n]{0,20}(?:（[^）]*）)?の?(?:拒否|妨害)[^。\n]{0,40}?(?P<value>[0-9０-９,]+万円)'
      expect: "100万円"

  # ---------------------------------------------------------------- 事故報告
  - id: sokuho-start-point
    label: 事故報告 速報の起算点は「知った時」（電気関係報告規則第3条第2項）
    source: 電気関係報告規則 第3条第2項（jiko-3.md 収録の e-Gov 一次照合済 逐語原文）
    verified: "2026-08-29"
    forbid:
      - pattern: '(?:事故の?)?発生から24時間|発生した時から24時間'
        why: 原文は「事故の発生を知つた時から二十四時間以内」。起算点は発生時ではなく覚知時
    unless:
      - '知った時|知つた時|覚知|ではな(?:い|く)|は誤り|旧版|訂正'

  # ---------------------------------------------------------------- 命令権者
  - id: article-40-minister
    label: 電気事業法第40条の命令権者は「主務大臣」
    source: 電気事業法 第40条第1項（e-Gov 339AC0000000170）
    verified: "2026-08-29"
    forbid:
      - pattern: '第40条[^。\n]{0,25}(?:は、?)?経済産業大臣が|経済産業大臣[^。\n]{0,20}第40条[^。\n]{0,15}命令'
        why: 条文は「主務大臣は、事業用電気工作物が…」。「経済産業大臣」と書くのは一般用を扱う第56条
    unless:
      - '主務大臣|実務上|ではな(?:い|く)|は誤り|旧版|訂正'

  # ---------------------------------------------------------------- 満点
  - id: exam-full-score
    label: 法規科目の満点は100点
    source: docs/kakomon/ranking.md ＋ repo 収録の実問題記録（A問題6点・B問題14点）
    verified: "2026-08-29"
    forbid:
      - pattern: '60点満点'
        why: 「60点満点・合格ライン60点」は満点以外すべて不合格になる自己矛盾。満点は100点・合格60点前後
    unless:
      - 'ではない|は誤り|旧版|訂正'
