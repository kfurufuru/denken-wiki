# 法令引用マスタ — check_law_citations.py が照合に使用
# 形式: {法律: {条文番号: {手続: 認可|届出|選任|検査|定義|目的|義務|資格|罰則|その他, 対象: 事業用|自家用|両方|無関係, 概要: 一行説明, 出典確認: YYYY-MM-DD}}}
# 出典: e-Gov 法令検索 (https://laws.e-gov.go.jp/) ＋ METI 産業保安監督部公式資料

電気事業法:
  1:
    手続: 目的
    対象: 両方
    概要: 法律の目的（電気事業の運営・電気工作物の保安）
    出典確認: 2026-05-05
  38:
    手続: 定義
    対象: 両方
    概要: 電気工作物の区分（一般用／小規模事業用／自家用／事業用）
    出典確認: 2026-05-05
  42:
    手続: 届出
    対象: 事業用
    概要: 事業用電気工作物（自家用含む）の保安規程の作成・届出
    出典確認: 2026-05-05
  43:
    手続: 選任
    対象: 事業用
    概要: 事業用電気工作物（自家用含む）の電気主任技術者の選任義務
    出典確認: 2026-05-05
  47:
    手続: 認可
    対象: 事業用
    概要: 事業用電気工作物のうち公共の安全の確保上特に重要なものの工事計画の認可
    出典確認: 2026-05-05
  48:
    手続: 届出
    対象: 両方
    概要: 第47条認可対象以外の事業用＋自家用電気工作物の工事計画の届出（30日前）
    出典確認: 2026-05-05
  50:
    手続: 検査
    対象: 事業用
    概要: 事業用電気工作物の使用前自主検査
    出典確認: 2026-05-05
  106:
    手続: 報告
    対象: 両方
    概要: 経済産業大臣への報告徴収
    出典確認: 2026-05-05

電気工事士法:
  1:
    手続: 目的
    対象: 両方
    概要: 電気工事の作業に従事する者の資格・義務／災害発生防止
    出典確認: 2026-05-05
  2:
    手続: 定義
    対象: 両方
    概要: 電気工事／一般用電気工作物等／自家用電気工作物／軽微な工事／電気工事士の定義
    出典確認: 2026-05-05
  3:
    手続: 資格
    対象: 両方
    概要: 第一種・第二種電気工事士の資格区分
    出典確認: 2026-05-05
  5:
    手続: 義務
    対象: 両方
    概要: 電技基準遵守・免状携帯等の義務
    出典確認: 2026-05-05

電気関係報告規則:
  3:
    手続: 報告
    対象: 自家用
    概要: 電気関係事故の報告
    出典確認: 2026-05-05
  4:
    手続: 報告
    対象: 自家用
    概要: 自家用電気工作物の特定施設等使用廃止報告
    出典確認: 2026-05-05
  5:
    手続: 報告
    対象: 自家用
    概要: 自家用電気工作物の事後報告（設置・変更・廃止後の遅滞なき報告）
    出典確認: 2026-05-05

# 特殊な手続きキーワードと対応する条文の検出パターン
# 「条文番号」が無い文脈で「認可」「届出」などのキーワードのみ登場した場合の警告用
キーワード対応:
  認可:
    - 電気事業法 第47条（事業用・特に重要）
  届出:
    - 電気事業法 第48条（自家用＋47条以外の事業用工事計画）
    - 電気事業法 第42条（保安規程）
    - 電気事業法 第43条（主任技術者選任）
    - 電気関係報告規則 各条
  選任:
    - 電気事業法 第43条（電気主任技術者）
  使用前自主検査:
    - 電気事業法 第50条
