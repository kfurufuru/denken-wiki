# ----------------------------------------------------------------------
# 第226条 低圧連系時の施設要件
# ----------------------------------------------------------------------
article_226:
  title: "低圧連系時の施設要件"
  delegating_provisions: ["省令第14条", "省令第20条"]
  body:
    - section: 1
      text: "単相3線式の低圧の電力系統に分散型電源を連系する場合において、負荷の不平衡により中性線に最大電流が生じるおそれがあるときは、分散型電源を施設した構内の電路であって、負荷及び分散型電源の並列点よりも系統側に、3極に過電流引き外し素子を有する遮断器を施設すること。"
      essence:
        - "対象: 単相3線式低圧"
        - "条件: 負荷不平衡で中性線最大電流のおそれ"
        - "義務: 負荷及び分散型電源の並列点より系統側に3極過電流引外し素子付遮断器"
    - section: 2
      text: "低圧の電力系統に逆変換装置を用いずに分散型電源を連系する場合は、逆潮流を生じさせないこと。"
      essence:
        - "対象: 逆変換装置なしの低圧連系（同期発電機等）"
        - "義務: 逆潮流禁止"
        - "改正: 令和4年改正で『これと同等の場合はこの限りでない』追加（要確認）"

# ----------------------------------------------------------------------
# 第227条 低圧連系時の系統連系用保護装置
# ----------------------------------------------------------------------
article_227:
  title: "低圧連系時の系統連系用保護装置"
  delegating_provisions: ["省令第15条"]  # 系統連系時の保安原則
  body:
    intro: "低圧の電力系統に分散型電源を連系する場合は、次の各号により、異常時に分散型電源を自動的に解列するための装置を施設すること。"
    items:
      - num: 一
        text: "次に掲げる異常を保護リレー等により検出し、分散型電源を自動的に解列すること。"
        sub_items:
          - num: イ
            text: "分散型電源の異常又は故障"
          - num: ロ
            text: "連系している電力系統の短絡事故、地絡事故又は高低圧混触事故"
          - num: ハ
            text: "分散型電源の単独運転又は逆充電"
      - num: 二
        text: "一般送配電事業者が運用する電力系統において再閉路が行われる場合は、当該再閉路時に、分散型電源が当該電力系統から解列されていること。"
      - num: 三
        text: "保護リレー等は、次によること。"
        sub_items:
          - num: イ
            text: "227-1表に規定する保護リレー等を受電点その他異常の検出が可能な場所に設置すること。"
  key_differences_vs_229:
    - "イ: 同一（分散型電源の異常又は故障）"
    - "ロ: 227に『高低圧混触事故』を含む / 229には無い"
    - "ハ: 227に『逆充電』を含む / 229は『単独運転』のみ"
    - "三イ: 227-1表 / 229-1表"
  disconnection_devices:  # 227条第4号で規定の解列場所
    - "受電用遮断器"
    - "分散型電源の出力端に設置する遮断器（または同等装置）"
    - "分散型電源の連絡用遮断器"

# ----------------------------------------------------------------------
# 第228条 高圧連系時の施設要件
# ----------------------------------------------------------------------
article_228:
  title: "高圧連系時の施設要件"
  delegating_provisions: ["省令第18条第1項", "省令第20条"]
  body:
    - section: 1
      text: "高圧の電力系統に分散型電源を連系する場合は、分散型電源を連系する配電用変電所の配電用変圧器において、逆向きの潮流を生じさせないこと。ただし、当該配電用変電所に保護装置を施設する等の方法により分散型電源と電力系統との協調をとることができる場合は、この限りではない。"
      essence:
        - "対象: 高圧連系"
        - "義務: 配電用変電所の配電用変圧器で逆向き潮流禁止"
        - "例外: 配電用変電所に保護装置施設等で系統協調がとれる場合"

# ----------------------------------------------------------------------
# 第229条 高圧連系時の系統連系用保護装置
# ----------------------------------------------------------------------
article_229:
  title: "高圧連系時の系統連系用保護装置"
  delegating_provisions: ["省令第15条"]
  body:
    intro: "高圧の電力系統に分散型電源を連系する場合は、次の各号により、異常時に分散型電源を自動的に解列するための装置を施設すること。"
    items:
      - num: 一
        text: "次に掲げる異常を保護リレー等により検出し、分散型電源を自動的に解列すること。"
        sub_items:
          - num: イ
            text: "分散型電源の異常又は故障"
          - num: ロ
            text: "連系している電力系統の短絡事故又は地絡事故"
          - num: ハ
            text: "分散型電源の単独運転"
      - num: 二
        text: "一般送配電事業者が運用する電力系統において再閉路が行われる場合は、当該再閉路時に、分散型電源が当該電力系統から解列されていること。"
      - num: 三
        text: "保護リレー等は、次によること。"
        sub_items:
          - num: イ
            text: "229-1表に規定する保護リレー等を受電点その他故障の検出が可能な場所に設置すること。"
  key_protection_relays:  # 試験頻出
    - "OVR (過電圧継電器)"
    - "UVR (不足電圧継電器)"
    - "OFR (過周波数継電器)"
    - "UFR (不足周波数継電器)"
    - "OVGR (地絡過電圧継電器)"
    - "単独運転検出装置"

