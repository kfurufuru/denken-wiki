{% extends "base.html" %}

{% block announce %}
  <div style="display:flex; gap:8px; align-items:center; justify-content:center; flex-wrap:wrap; padding:2px 0;">
    <a href="https://kfurufuru.github.io/secretary-portal/" style="font-weight:600; color:#fff; text-decoration:none; background:rgba(255,255,255,0.08); border:1px solid rgba(255,255,255,0.2); border-radius:4px; padding:2px 10px; font-size:0.82rem;" onmouseover="this.style.background='rgba(255,255,255,0.2)'" onmouseout="this.style.background='rgba(255,255,255,0.08)'">← ポータル</a>
    <span style="color:rgba(255,255,255,0.3);">|</span>
    <span style="font-size:0.78rem; color:rgba(255,255,255,0.6); margin-right:4px;">電験3種 :</span>
    <span style="font-weight:700; color:#fff; background:rgba(255,255,255,0.25); border-radius:4px; padding:2px 10px; font-size:0.82rem;">
      📗 法規Wiki
    </span>
    <a href="https://kfurufuru.github.io/denken-wiki-riron/"
       style="font-weight:600; color:#fff; text-decoration:none; background:rgba(255,255,255,0.12); border:1px solid rgba(255,255,255,0.35); border-radius:4px; padding:2px 10px; font-size:0.82rem;"
       onmouseover="this.style.background='rgba(255,255,255,0.22)'" onmouseout="this.style.background='rgba(255,255,255,0.12)'">
      📘 理論Wiki
    </a>
    <a href="https://kfurufuru.github.io/denken-wiki-denryoku/"
       style="font-weight:600; color:#fff; text-decoration:none; background:rgba(255,255,255,0.12); border:1px solid rgba(255,255,255,0.35); border-radius:4px; padding:2px 10px; font-size:0.82rem;"
       onmouseover="this.style.background='rgba(255,255,255,0.22)'" onmouseout="this.style.background='rgba(255,255,255,0.12)'">
      ⚡ 電力Wiki
    </a>
    <span style="color:rgba(255,255,255,0.4); margin:0 2px;">|</span>
    <a href="https://kfurufuru.github.io/ei-wiki/"
       style="font-weight:600; color:#fff; text-decoration:none; background:rgba(255,255,255,0.12); border:1px solid rgba(255,255,255,0.35); border-radius:4px; padding:2px 10px; font-size:0.82rem;"
       onmouseover="this.style.background='rgba(255,255,255,0.22)'" onmouseout="this.style.background='rgba(255,255,255,0.12)'">
      🔧 電気計装Wiki
    </a>
  </div>
{% endblock %}

{% block content %}
{{ super() }}
{% if page and not page.is_homepage %}
  <details class="dk-chatgpt-prompt" style="margin-top:2.5rem;border:1px solid var(--md-default-fg-color--lightest);border-radius:6px;padding:0.7rem 1rem;background:var(--md-code-bg-color);">
    <summary style="cursor:pointer;font-weight:600;font-size:0.9rem;">🤖 この記事をChatGPTに渡す（プロンプト生成）</summary>
    <div style="margin-top:0.8rem;">
      <textarea id="dk-prompt-text" readonly style="width:100%;min-height:160px;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:0.82rem;padding:0.6rem;border:1px solid var(--md-default-fg-color--lightest);border-radius:4px;background:var(--md-default-bg-color);color:var(--md-default-fg-color);resize:vertical;box-sizing:border-box;"></textarea>
      <div style="margin-top:0.5rem;display:flex;gap:0.6rem;align-items:center;flex-wrap:wrap;">
        <button id="dk-prompt-copy" style="padding:0.45rem 1rem;background:var(--md-primary-fg-color);color:var(--md-primary-bg-color);border:none;border-radius:4px;cursor:pointer;font-weight:600;font-size:0.82rem;">📋 プロンプトをコピー</button>
        <a id="dk-prompt-chatgpt" href="https://chat.openai.com/" target="_blank" rel="noopener" style="padding:0.45rem 1rem;background:transparent;color:var(--md-primary-fg-color);border:1px solid var(--md-primary-fg-color);border-radius:4px;text-decoration:none;font-weight:600;font-size:0.82rem;">↗ ChatGPTを開く</a>
        <span id="dk-prompt-status" style="font-size:0.78rem;color:var(--md-default-fg-color--light);"></span>
      </div>
      <p style="margin-top:0.6rem;font-size:0.74rem;color:var(--md-default-fg-color--light);line-height:1.5;">使い方: コピー → ChatGPT で貼り付け → 質問を追記して送信。</p>
    </div>
  </details>
  <script>
  (function(){
    var ta = document.getElementById('dk-prompt-text');
    if (!ta) return;
    var title = {{ (page.title or config.site_name) | tojson }};
    var url   = {{ (page.canonical_url or (config.site_url ~ page.url)) | tojson }};
    var siteName = {{ config.site_name | tojson }};
    ta.value = '以下の記事を参照して、私の質問に答えてください。\n\n' +
               '【サイト】' + siteName + '\n' +
               '【記事タイトル】' + title + '\n' +
               '【URL】' + url + '\n\n' +
               '# 質問\n（ここに質問を書いてください）';
    var btn = document.getElementById('dk-prompt-copy');
    var status = document.getElementById('dk-prompt-status');
    btn.addEventListener('click', function(){
      var fallback = function(){
        ta.removeAttribute('readonly');
        ta.select();
        try { document.execCommand('copy'); status.textContent = '✅ コピーしました'; }
        catch(e) { status.textContent = '⚠ 手動でコピーしてください'; }
        ta.setAttribute('readonly', 'readonly');
      };
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(ta.value).then(function(){
          status.textContent = '✅ コピーしました';
        }).catch(fallback);
      } else { fallback(); }
      setTimeout(function(){ status.textContent = ''; }, 2500);
    });
  })();
  </script>
{% endif %}
{% endblock %}
