{% extends "base.html" %}

{% block announce %}
<script>
(function(){
  var p=new URLSearchParams(location.search);
  if(p.get('from')==='portal'){sessionStorage.setItem('_ph',history.length);history.replaceState(null,'',location.pathname+location.hash);}
  window._portalBack=function(){var h=sessionStorage.getItem('_ph');history.go(h?parseInt(h)-history.length-1:-1);};
})();
</script>
  <div style="display:flex; gap:8px; align-items:center; justify-content:center; flex-wrap:wrap; padding:2px 0;">
    <button onclick="_portalBack()" style="font-weight:600; color:#fff; background:rgba(255,255,255,0.08); border:1px solid rgba(255,255,255,0.2); border-radius:4px; padding:2px 10px; font-size:0.82rem; cursor:pointer;" onmouseover="this.style.background='rgba(255,255,255,0.2)'" onmouseout="this.style.background='rgba(255,255,255,0.08)'">← ポータル</button>
    <span style="color:rgba(255,255,255,0.3);">|</span>
    <span style="font-size:0.78rem; color:rgba(255,255,255,0.6); margin-right:4px;">電験3種 :</span>
    <span style="font-weight:700; color:#fff; background:rgba(255,255,255,0.25); border-radius:4px; padding:2px 10px; font-size:0.82rem;">
      📗 法規Wiki
    </span>
    <a href="https://kfurufuru.github.io/denken-wiki-riron/"
       style="font-weight:600; color:#fff; text-decoration:none; background:rgba(255,255,255,0.12); border:1px solid rgba(255,255,255,0.35); border-radius:4px; padding:2px 10px; font-size:0.82rem;"
       onmouseover="this.style.background='rgba(255,255,255,0.22)'" onmouseout="this.style.background='rgba(255,255,255,0.12)'">

       onmouseover="this.style.background='rgba(255,255,255,0.22)'" onmouseout="this.style.background='rgba(255,255,255,0.12)'">
      ⚡ 電力Wiki
    </a>
    <span style="color:rgba(255,255,255,0.4); margin:0 2px;">|</span>
