site_name: "電験3種 法規Wiki"
site_description: "電験3種 法規 — 条文×過去問クロスリファレンス"
site_url: "https://kfurufuru.github.io/denken-wiki/"
site_author: "Furutachi"
repo_url: "https://github.com/kfurufuru/denken-wiki"
repo_name: "denken-wiki"
copyright: "&copy; 2026 Furutachi — 個人学習用"

theme:
  name: material
  custom_dir: overrides
  language: ja
  font:
    text: Noto Sans JP
    code: Roboto Mono
  palette:
    - scheme: default
      primary: custom
      accent: custom
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - navigation.instant
    - navigation.instant.progress
    - navigation.path
    - navigation.footer
    - search.suggest
    - search.highlight
    - search.share
    - content.tabs.link
    - content.tooltips
    - toc.follow
  icon:
    repo: fontawesome/brands/github

plugins:
  - search:
      lang: ja
      separator: '[\s\-\.]+'
  - macros:
      module_name: main
      include_yaml:
        - _data/kakomon.yml

exclude_docs: |
  _data/

hooks:
  - hooks/inject_hoki.py
  - hooks/bold_unit_separator.py

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.critic
  - pymdownx.mark
  - tables
  - attr_list
  - md_in_html
  - def_list
  - footnotes
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - toc:
      permalink: true
  - abbr
  - pymdownx.snippets:
      auto_append:
        - includes/abbreviations.md
  - pymdownx.tasklist:
      custom_checkbox: true
      clickable_checkbox: true
  - pymdownx.arithmatex:
      generic: true

extra_css:
  - stylesheets/design-tokens.css
  - stylesheets/custom.css

extra_javascript:
  - https://unpkg.com/mermaid@10/dist/mermaid.min.js
  - javascripts/theme-filter.js
  - javascripts/task-checkbox.js
  - javascripts/self-check.js
  - javascripts/search-filter.js
  - javascripts/chatgpt-prompt.js
  - javascripts/mathjax.js
  - https://polyfill.io/v3/polyfill.min.js?features=es6
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/kfurufuru/denken-wiki
      name: GitHub リポジトリ

